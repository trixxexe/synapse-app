name: synapse_app
description: Context-aware productivity engine with biometric health integration and notification mediation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Health & Biometric Data Integration
  health: ^12.0.0

  # Local Notifications & DND Control
  flutter_local_notifications: ^18.0.1

  # Typography & Theming
  google_fonts: ^6.1.0

  # Utilities
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  permission_handler: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  riverpod_generator: ^2.3.9
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
